<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
  <rect width="100" height="100" fill="#6fb244"/>
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#7a4a2b" stroke-width="6"/>
  <!-- pixel dumbbell, blocky, brown/tan on grass -->
  <g stroke="#4a2f1a" stroke-width="1">
    <!-- bar -->
    <rect x="30" y="44" width="40" height="12" fill="#7a4a2b"/>
    <!-- left plate -->
    <rect x="12" y="24" width="18" height="52" fill="#7a4a2b"/>
    <rect x="12" y="24" width="18" height="10" fill="#e8d5a0"/>
    <!-- right plate -->
    <rect x="70" y="24" width="18" height="52" fill="#7a4a2b"/>
    <rect x="70" y="24" width="18" height="10" fill="#e8d5a0"/>
    <!-- grip highlight on bar -->
    <rect x="34" y="46" width="32" height="4" fill="#e8d5a0"/>
  </g>
</svg>
