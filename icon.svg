<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
  <rect width="100" height="100" fill="#e8e4f8"/>
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#3d3355" stroke-width="4"/>
  <!-- pixel dumbbell, pastel lilac/cream on soft lilac field -->
  <g stroke="#3d3355" stroke-width="1">
    <!-- bar -->
    <rect x="30" y="44" width="40" height="12" fill="#f4a6c0"/>
    <!-- left plate -->
    <rect x="12" y="24" width="18" height="52" fill="#c9c2e8"/>
    <rect x="12" y="24" width="18" height="10" fill="#fdf8f4"/>
    <!-- right plate -->
    <rect x="70" y="24" width="18" height="52" fill="#c9c2e8"/>
    <rect x="70" y="24" width="18" height="10" fill="#fdf8f4"/>
    <!-- grip highlight on bar -->
    <rect x="34" y="46" width="32" height="4" fill="#fdf8f4"/>
  </g>
</svg>
