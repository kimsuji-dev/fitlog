<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian 열기</title>
<style>body{margin:0;padding:32px 24px;font-family:-apple-system,system-ui,sans-serif;background:#0a0a0c;color:#eee}a{color:#fff}</style>
<p>Obsidian을 여는 중…</p>
<p>안 열리면 <a id="a">여기를 눌러</a> 주세요.</p>
<script>
// 텔레그램은 obsidian:// 링크를 직접 못 열어서 https 페이지를 거쳐 앱으로 넘긴다.
// ?f=시장조사/2026-08-22 (vault 상대 경로, .md 없이) · ?v=vault이름 (생략하면 마지막에 연 vault)
const p = new URLSearchParams(location.search)
const f = p.get('f') || ''
const v = p.get('v')
const url = 'obsidian://open?' + (v ? 'vault=' + encodeURIComponent(v) + '&' : '') + 'file=' + encodeURIComponent(f)
document.getElementById('a').href = url
location.replace(url)
</script>
