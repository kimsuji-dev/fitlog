<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian 열기</title>
<style>
  body{margin:0;padding:28px 22px 48px;font-family:-apple-system,system-ui,sans-serif;
       background:#0a0a0c;color:#eee;line-height:1.6}
  a{color:#fff}
  code{background:#16161b;padding:3px 7px;border-radius:5px;font-size:.88em;word-break:break-all}
  .btn{display:block;margin:10px 0;padding:14px 16px;background:#16161b;border:1px solid #2c2c33;
       border-radius:12px;text-decoration:none;color:#eee}
  .btn b{color:#fff}
  .btn small{display:block;color:#8b8b95;font-size:.8em;margin-top:2px}
  .primary{background:#1e1e26;border-color:#44444f}
  .panel{margin-top:26px;padding-top:18px;border-top:1px solid #1e1e24}
  h2{font-size:1em;margin:0 0 4px}
  p.muted{color:#9a9aa4;font-size:.9em}
</style>

<p class="muted">Obsidian을 여는 중…</p>
<p><code id="target"></code></p>
<a class="btn primary" id="v0"><b>Obsidian에서 열기</b><small>자동으로 한 번 시도했어요</small></a>

<div class="panel" id="panel" hidden>
  <h2>안 열렸거나 다른 노트가 떴나요?</h2>
  <p class="muted">Obsidian은 노트를 못 찾아도 오류를 내지 않고 그냥 직전에 보던 노트를 보여줍니다.
  아래를 위에서부터 눌러 보세요.</p>
  <a class="btn" id="v1"><b>② 폴더 경로까지 넣어서</b><small>파일명만으로 못 찾는 경우</small></a>
  <a class="btn" id="v2"><b>③ vault 지정 없이</b><small>폰의 vault 이름이 'brain'이 아닐 때</small></a>
  <a class="btn" id="v3"><b>④ 이 이름으로 검색</b><small>열기 대신 검색 — 노트가 기기에 있는지 확인용</small></a>
</div>

<script>
// 텔레그램은 obsidian:// 링크를 직접 못 열어서 https 페이지를 거쳐 앱으로 넘긴다.
// ?f=뉴스레터/2026-08-27 (vault 상대 경로, .md 없이) · ?v=vault이름
//
// 2026-08-27: 기본 동작을 "파일명만"으로 바꿨다. 맥에서는 폴더 경로가 잘 되는데
// 폰에서는 계속 직전 노트(=어제 뉴스레터)가 열렸다. vault 전체에서 파일명이 유일한 것을
// 확인했고(중복 0건), 이름만 넘기면 슬래시 인코딩(%2F)·하위폴더 해석 문제가 통째로 사라진다.
// 맥에서 2026-08-27 / 2026-08-26이 각각 정확히 열리는 것까지 확인.
// 폴더 경로 방식은 ②로 남겨둔다 — 나중에 같은 이름 파일이 생기면 그때 필요하다.
const p = new URLSearchParams(location.search)
const f = p.get('f') || ''
const v = p.get('v')
const vq = v ? 'vault=' + encodeURIComponent(v) + '&' : ''
const base = f.split('/').pop()
const enc = encodeURIComponent

const urls = [
  'obsidian://open?' + vq + 'file=' + enc(base),   // 기본: 파일명만
  'obsidian://open?' + vq + 'file=' + enc(f),      // 폴더 경로까지
  'obsidian://open?file=' + enc(base),             // vault 미지정
  'obsidian://search?' + vq + 'query=' + enc(base),
]
urls.forEach((u, i) => { document.getElementById('v' + i).href = u })
document.getElementById('target').textContent = f || '(경로 없음)'

if (f) location.replace(urls[0])
// 앱으로 넘어갔으면 이 페이지는 안 보인다. 남아 있다는 건 실패했거나 사용자가 돌아온 것.
setTimeout(() => { document.getElementById('panel').hidden = false }, 1200)
</script>
